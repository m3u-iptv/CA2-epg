name: Grab DishTV EPG

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4
        with:
          ref: CA2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone iptv-org/epg
        run: git clone --depth 1 https://github.com epg-tool

      - name: Install dependencies and grab EPG
        run: |
          cd epg-tool
          npm install
          npm run grab --- --channels=../channels.xml --output=../guide.xml --days=2 --timeout=60000

      - name: Save guide.xml to GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f guide.xml
          git commit -m "Update Goldmines EPG" || echo "No changes to commit"
          git push origin HEAD:CA2
          
